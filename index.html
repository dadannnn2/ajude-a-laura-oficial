  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brasa:        #e8432b;
      --brasa-fundo:  #c7331d;
      --brasa-veu:    #fdeae5;
      --terra:        #e3832f;
      --terra-fundo:  #c86c1f;
      --terra-clara:  #f6a93b;
      --cacau:        #4a2b22;
      --cacau-noite:  #30170f;
      --creme:        #fdf1e6;
      --creme-fundo:  #f8e2cd;
      --papel:        #fffaf5;
      --folha:        #ffffff;
      --tinta:        #3b231c;
      --tinta-media:  #7c5c4f;
      --linha:        #ecd8c5;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Mulish', system-ui, sans-serif;
      background: var(--papel);
      color: var(--tinta);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }
    img { max-width: 100%; height: auto; }
    a { color: inherit; text-decoration: none; }

    .cabecalho-selo {
      background: var(--folha);
      border-bottom: 3px solid var(--terra);
      padding: 0.55rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .selo-figura {
      height: 94px;
      width: auto;
      object-fit: contain;
    }

    .coluna { max-width: 640px; margin: 0 auto; padding: 0 1.15rem; }

    .chamada { padding: 1.55rem 0 1.05rem; text-align: center; }
    .chamada-tag {
      display: inline-block;
      background: var(--brasa-veu);
      color: var(--brasa-fundo);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 0.95rem;
      border-radius: 4px;
      margin-bottom: 0.8rem;
      border: 1px solid #f7c9bd;
      font-family: 'Figtree', sans-serif;
    }
    .chamada h1 {
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: clamp(1.38rem, 5vw, 1.92rem);
      font-weight: 800;
      line-height: 1.22;
      color: var(--cacau);
      margin-bottom: 0.7rem;
      text-wrap: balance;
    }
    .chamada p {
      font-size: 1rem;
      color: var(--tinta-media);
      line-height: 1.7;
      max-width: 540px;
      margin: 0 auto;
    }

    .capa { margin-bottom: 1.45rem; }
    .capa-img {
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: min(86vh, 680px);
      object-fit: cover;
      object-position: center 18%;
      display: block;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 10px 28px rgba(74,43,34,0.24);
    }
    .capa-nota {
      background: var(--cacau);
      color: rgba(255,255,255,0.88);
      border-radius: 0 0 8px 8px;
      padding: 0.72rem 1rem;
      font-size: 0.8rem;
      font-style: italic;
      line-height: 1.5;
    }

    .painel-meta {
      background: var(--folha);
      border: 1px solid var(--linha);
      border-radius: 8px;
      padding: 1.3rem 1.15rem 1.1rem;
      margin-bottom: 1.35rem;
      box-shadow: 0 4px 18px rgba(74,43,34,0.08);
    }
    .painel-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.8rem;
    }
    .painel-cifra {
      font-size: 1.92rem;
      font-weight: 800;
      color: var(--terra-fundo);
      line-height: 1;
      font-family: 'Figtree', sans-serif;
    }
    .painel-sub { font-size: 0.76rem; color: var(--tinta-media); margin-top: 0.28rem; }
    .painel-pct {
      font-size: 1.92rem;
      font-weight: 800;
      color: var(--brasa);
      line-height: 1;
      text-align: right;
      font-family: 'Figtree', sans-serif;
    }
    .painel-pct small {
      display: block;
      font-size: 0.6rem;
      font-weight: 800;
      color: var(--tinta-media);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }
    .painel-trilho {
      width: 100%;
      height: 10px;
      background: var(--creme-fundo);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    .painel-onda {
      height: 100%;
      width: 37%;
      background: linear-gradient(90deg, var(--terra-clara), var(--terra), var(--brasa));
      border-radius: 3px;
    }
    .painel-rodape {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--tinta-media);
    }
    .painel-rodape strong { color: var(--tinta); font-weight: 700; }

    .selo-pix {
      font-size: 0.73rem;
      color: var(--tinta-media);
      text-align: center;
      margin-bottom: 1.8rem;
    }

    hr.divisa { border: none; border-top: 1px solid var(--linha); margin: 1.8rem 0; }

    .bloco { margin-bottom: 1.55rem; }
    .bloco-titulo {
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 1.14rem;
      font-weight: 700;
      line-height: 1.32;
      color: var(--folha);
      background: var(--cacau);
      padding: 0.7rem 1rem;
      border-radius: 6px;
      margin-bottom: 0.9rem;
    }
    .bloco p {
      font-size: 0.98rem;
      color: var(--tinta);
      line-height: 1.84;
      margin-bottom: 0.78rem;
      padding: 0 0.1rem;
    }
    .bloco p:last-child { margin-bottom: 0; }
    .bloco strong { color: var(--cacau); }

    .alerta-forte {
      background: var(--brasa-veu);
      border-left: 4px solid var(--brasa);
      border-radius: 0 6px 6px 0;
      padding: 0.74rem 0.95rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: #a62d1a;
      line-height: 1.58;
      margin: 0.7rem 0;
    }

    .frase-forte {
      text-align: center;
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--cacau);
      background: linear-gradient(135deg, var(--creme), var(--brasa-veu));
      border-radius: 8px;
      padding: 1.1rem 1.15rem;
      margin: 1.15rem 0;
      line-height: 1.5;
    }

    .fala-familia {
      background: var(--creme);
      border: 1px solid var(--linha);
      border-radius: 8px;
      padding: 1.15rem 1.2rem;
      margin: 1.25rem 0;
      font-size: 0.96rem;
      font-style: italic;
      color: var(--tinta);
      line-height: 1.78;
    }
    .fala-abre { font-style: normal; font-weight: 800; color: var(--terra-fundo); font-family: 'Figtree', sans-serif; }
    .fala-familia cite {
      display: block;
      margin-top: 0.55rem;
      font-size: 0.76rem;
      font-style: normal;
      font-weight: 800;
      color: var(--cacau);
    }

    .doar-cabeca { text-align: center; margin-bottom: 1.15rem; }
    .doar-cabeca h2 {
      font-family: 'Figtree', system-ui, sans-serif;
      font-size: 1.32rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      line-height: 1.25;
      color: var(--cacau);
    }
    .doar-cabeca p { font-size: 0.88rem; color: var(--tinta-media); line-height: 1.6; }
